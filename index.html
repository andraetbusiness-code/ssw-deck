  .brand-logo-hero{width:180px;height:180px;background:var(--ssw-logo) center/contain no-repeat;margin:0 auto 18px auto;display:block;filter:drop-shadow(0 6px 22px rgba(0,0,0,.15))}
  .brand-logo-watermark{position:absolute;top:18px;right:22px;width:80px;height:80px;background:var(--ssw-logo) center/contain no-repeat;opacity:.14;pointer-events:none;z-index:1}
  .opener .brand-logo-watermark{opacity:.24;filter:brightness(1.45) contrast(.85)}
  .brand-logo-footer{width:22px;height:22px;background:var(--ssw-logo) center/contain no-repeat;border-radius:50%;flex-shrink:0}
  .slide-footer .brand-wrap{display:flex;align-items:center;gap:8px}
  .brand-anchor{text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--ssw-blue);font-weight:700;margin-top:10px}
  .title-slide .brand-anchor{margin-top:6px}
  .close-slide .brand-anchor{margin-top:14px;color:var(--ssw-accent)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","SF Pro Text",Inter,Helvetica,Arial,sans-serif;background:#0a0f1c;color:var(--ink);overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#14223f 0%,#0a0f1c 70%)}
  .slide{position:absolute;width:min(94vw,1280px);height:min(88vh,720px);background:var(--paper);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);overflow:hidden;display:none;flex-direction:column}
  .slide.active{display:flex;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .slide-body{flex:1;padding:44px 56px 22px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .slide-footer{height:34px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:var(--ssw-navy);color:#cfe1f5;font-size:11px;letter-spacing:.04em}
  .slide-footer .brand{font-weight:700;color:#fff;letter-spacing:.08em}
  .slide-footer .counter{font-variant-numeric:tabular-nums}
  .slide-footer .sec{color:var(--ssw-water);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10px}

  h1.title{font-size:58px;line-height:1.05;color:var(--ssw-navy);letter-spacing:-.02em;font-weight:800}
  h1.title .accent{color:var(--ssw-accent)}

/* ============================================================
   RENDERER + NAV
   ============================================================ */
const stage = document.getElementById('stage');
const notesEl = document.getElementById('notes');
const notesTitle = document.getElementById('notes-title');
const notesBody = document.getElementById('notes-body');
const navOverlay = document.getElementById('navOverlay');
const navGrid = document.getElementById('navGrid');
let current = 0;

SLIDES.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (s.type === 'title' ? ' title-slide' : '') + (s.type === 'close' ? ' close-slide' : '');
  // find the section this slide belongs to
  let sec = SECTIONS[0];
  for (let j = SECTIONS.length - 1; j >= 0; j--) {
    if (SECTIONS[j].start <= i) { sec = SECTIONS[j]; break; }
  }
  div.innerHTML = s.html + `<div class="slide-footer">
    <span class="brand-wrap"><span class="brand-logo-footer" aria-hidden="true"></span><span class="brand">Select Source Water · Inside Home Depot</span></span>
    <span class="sec">${sec.label}</span>
    <span class="counter">${String(i+1).padStart(3,'0')} / ${String(SLIDES.length).padStart(3,'0')}</span>
  </div>`;
  stage.appendChild(div);
});

// build nav grid
SECTIONS.forEach((sec, idx) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<b>Section</b>${sec.label}<br><span style="opacity:.6;font-size:10px">slide ${sec.start + 1}</span>`;
  btn.onclick = () => { show(sec.start); toggleNav(); };
  navGrid.appendChild(btn);
});

function renderNotes() {
  const s = SLIDES[current];
  if (!s.notes) { notesTitle.textContent = 'Speaker Notes'; notesBody.innerHTML = '<p>No notes for this slide.</p>'; return; }
  notesTitle.textContent = s.notes.title;
  notesBody.innerHTML = s.notes.blocks.map(b => `<p><span class="who">${b.who}</span>${b.text}</p>`).join('');
}

function show(i) {
  if (i < 0 || i >= SLIDES.length) return;
  document.querySelectorAll('.slide').forEach((el, idx) => el.classList.toggle('active', idx === i));
  current = i;
  renderNotes();
}

function nextSlide() { if (current < SLIDES.length - 1) show(current + 1); }
function prevSlide() { if (current > 0) show(current - 1); }
function toggleNotes() { notesEl.classList.toggle('open'); }
function toggleNav() { navOverlay.classList.toggle('open'); }
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
function jumpToSection(label) {
  const sec = SECTIONS.find(s => s.label === label) || SECTIONS.find(s => s.label.startsWith(label));
  if (sec) show(sec.start);
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if (e.key === 'm' || e.key === 'M') toggleNav();
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  else if (e.key === 'p' || e.key === 'P') window.print();
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(SLIDES.length - 1);
  else if (e.key === 'Escape') { navOverlay.classList.remove('open'); notesEl.classList.remove('open'); }
});

show(0);
</script>
